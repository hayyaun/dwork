[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "dwork-cli"
version = "0.2.0"
description = "Switch development workspaces, resume existing containers, and launch terminals"
readme = "packaging/python/PYPI_README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Hayyan Hami"}]
dependencies = ["PyYAML>=6.0,<7"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development",
]

[project.scripts]
dwork = "dwork:cli"

[project.urls]
Homepage = "https://github.com/hayyaun/dwork"
Documentation = "https://github.com/hayyaun/dwork/tree/main/docs"
Issues = "https://github.com/hayyaun/dwork/issues"

[tool.setuptools]
py-modules = ["dwork"]
package-dir = {"" = "lib"}
