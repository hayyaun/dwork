[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "dwork-cli"
dynamic = ["version"]
description = "Switch development workspaces, resume existing containers, and launch terminals and browsers"
readme = "packaging/python/PYPI_README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Hayyan Hami"}]
dependencies = ["PyYAML>=6.0,<7"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development",
]

[project.optional-dependencies]
test = ["jsonschema>=4.18,<5"]

[project.scripts]
dwork = "dwork:cli"

[project.urls]
Homepage = "https://github.com/hayyaun/dwork"
Documentation = "https://github.com/hayyaun/dwork/tree/main/docs"
Issues = "https://github.com/hayyaun/dwork/issues"

[tool.setuptools]
py-modules = [
  "dwork",
  "dwork_cli",
  "dwork_common",
  "dwork_config",
  "dwork_docker",
  "dwork_plans",
  "dwork_registry",
  "dwork_scan",
  "dwork_tasks",
  "dwork_terminals",
  "dwork_browsers",
  "dwork_workspaces",
  "dwork_version",
]
package-dir = {"" = "lib"}

[tool.setuptools.dynamic]
version = {attr = "dwork_version.__version__"}
