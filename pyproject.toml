[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "dwork-cli"
dynamic = ["version"]
description = "Switch development workspaces, resume existing containers, and launch terminals and browsers"
readme = "packaging/python/PYPI_README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Hayyan Hami"}]
dependencies = ["PyYAML>=6.0,<7"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development",
]

[project.optional-dependencies]
test = ["jsonschema>=4.18,<5"]
quality = ["ruff==0.17.1", "mypy==2.4.0", "types-PyYAML==6.0.12.20260906"]

[project.scripts]
dwork = "dwork:cli"

[project.urls]
Homepage = "https://github.com/hayyaun/dwork"
Documentation = "https://github.com/hayyaun/dwork/tree/main/docs"
Issues = "https://github.com/hayyaun/dwork/issues"

[tool.setuptools]
py-modules = [
  "dwork",
  "dwork_cli",
  "dwork_common",
  "dwork_config",
  "dwork_docker",
  "dwork_plans",
  "dwork_registry",
  "dwork_scan",
  "dwork_tasks",
  "dwork_terminals",
  "dwork_browsers",
  "dwork_workspaces",
  "dwork_config_parse",
  "dwork_registry_store",
  "dwork_registry_policy",
  "dwork_launch",
  "dwork_terminal_launch",
  "dwork_browser_launch",
  "dwork_process",
  "dwork_status",
  "dwork_version",
]
package-dir = {"" = "lib"}

[tool.setuptools.dynamic]
version = {attr = "dwork_version.__version__"}

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["graphify-out"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# These tests locate the source checkout before importing runtime modules.
"tests/test_examples.py" = ["E402"]
"tests/test_schema.py" = ["E402"]

[tool.mypy]
python_version = "3.10"
platform = "linux"
mypy_path = "lib"
files = ["lib", "scripts", "companion/src"]
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["dwork_common", "dwork_launch", "dwork_plans", "dwork_process"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_calls = true
warn_return_any = true
no_implicit_reexport = true

[[tool.mypy.overrides]]
# Optional platform GUI frameworks ship without portable type stubs.
module = ["pystray", "gi.*", "PIL", "PyObjCTools"]
ignore_missing_imports = true
