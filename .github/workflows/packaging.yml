name: Package verification

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v[0-9]*.[0-9]*.[0-9]*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"
      - run: python -m pip install '.[quality]'
      - run: make quality

  python:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04]
        python: ["3.10", "3.14"]
        # Keep the minimum macOS Python on routine runs; expand on tags/manual runs.
        include: >-
          ${{ fromJSON(
            (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v'))
            && '[{"os":"macos-15","python":"3.13"},{"os":"macos-15","python":"3.14"},{"os":"macos-15-intel","python":"3.14"}]'
            || '[{"os":"macos-15","python":"3.13"}]'
          ) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install build twine '.[test]'
      - name: Source tests
        shell: bash
        run: |
          result=0
          for test_file in tests/test_*.py; do
            python -B -m unittest discover -s tests -p "$(basename "$test_file")" -v --failfast || result=1
          done
          exit "$result"
      - run: python scripts/verify-python-package.py

  companion:
    name: Companion package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - run: python -m pip install build twine
      - name: Build separate CLI and companion wheels
        shell: bash
        run: |
          python -m build --wheel --outdir "$RUNNER_TEMP/dwork-wheels"
          python -m build companion --outdir "$RUNNER_TEMP/dwork-wheels"
          python -m twine check --strict "$RUNNER_TEMP"/dwork-wheels/*
      - name: Install matching wheels and check non-GUI entry points
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/companion-venv"
          "$RUNNER_TEMP/companion-venv/bin/python" -m pip install "$RUNNER_TEMP"/dwork-wheels/*.whl
          mkdir -p "$RUNNER_TEMP/companion-smoke"
          cd "$RUNNER_TEMP/companion-smoke"
          export XDG_STATE_HOME="$RUNNER_TEMP/companion-state"
          "$RUNNER_TEMP/companion-venv/bin/python" -c "from dwork_tray.platforms import load_icon; load_icon().load()"
          "$RUNNER_TEMP/companion-venv/bin/dwork-tray" --help
          "$RUNNER_TEMP/companion-venv/bin/dwork" list --json
      - name: Native Linux bindings for the managed tray installer
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-venv python3-gi gir1.2-ayatanaappindicator3-0.1
      - name: Install and remove the optional native tray without launching it
        shell: bash
        run: |
          installer_python=python
          if [ "${{ runner.os }}" = Linux ]; then installer_python=/usr/bin/python3; fi
          prefix="$RUNNER_TEMP/dwork-managed-tray"
          make install TRAY=1 PYTHON="$installer_python" PREFIX="$prefix"
          cd "$RUNNER_TEMP/companion-smoke"
          "$prefix/bin/dwork" --version
          "$prefix/bin/dwork-tray" --help
          "$prefix/share/dwork/tray-venv/bin/python" -c "from importlib.metadata import version; from dwork_tray.platforms import load_icon; assert version('dwork-tray'); load_icon().load()"
          cd "$GITHUB_WORKSPACE"
          make uninstall PYTHON="$installer_python" PREFIX="$prefix"
          test ! -e "$prefix/bin/dwork"
          test ! -e "$prefix/bin/dwork-tray"
          test ! -e "$prefix/share/dwork"
      - name: Validate the public pystray menu contract without displaying an icon
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cd "$RUNNER_TEMP/companion-smoke"
          "$RUNNER_TEMP/companion-venv/bin/python" - <<'PY'
          import pystray
          from types import SimpleNamespace
          from tempfile import TemporaryDirectory
          from dwork_tray.app import Companion
          from dwork_tray.model import WorkspaceItem
          with TemporaryDirectory() as directory:
              ui = SimpleNamespace(Icon=lambda *args, **kwargs: None, Menu=pystray.Menu, MenuItem=pystray.MenuItem)
              app = Companion(ui, None, lambda callback: None, directory)
              app.rows = (WorkspaceItem("first", "First", True), WorkspaceItem("second", "Second", True))
              rows = list(app.menu_items())
              rows[1](None)
              rows[2](None)
              assert app.jobs.get_nowait() == ("switch", "first")
              assert app.jobs.get_nowait() == ("switch", "second")
          PY

  companion-windows:
    name: Windows-to-WSL companion
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - run: python -m pip install build twine
      - name: Build companion independently of the POSIX CLI
        shell: pwsh
        run: |
          python -m build companion --outdir "$env:RUNNER_TEMP/dwork-windows"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m twine check --strict "$env:RUNNER_TEMP/dwork-windows/*"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m venv "$env:RUNNER_TEMP/tray-venv"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & "$env:RUNNER_TEMP/tray-venv/Scripts/python.exe" -m pip install (Get-Item "$env:RUNNER_TEMP/dwork-windows/*.whl").FullName
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Windows transport and PowerShell quoting regressions
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP/tray-venv/Scripts/python.exe" -B tests/test_wsl_tray.py -v
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Installed entry point without core CLI or a tray icon
        shell: pwsh
        run: |
          Set-Location $env:RUNNER_TEMP
          Remove-Item Env:PYTHONPATH -ErrorAction SilentlyContinue
          & "$env:RUNNER_TEMP/tray-venv/Scripts/python.exe" -c "import importlib.util; from dwork_tray import wsl, observer; assert importlib.util.find_spec('dwork') is None"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & "$env:RUNNER_TEMP/tray-venv/Scripts/python.exe" -c "from dwork_tray.platforms import load_icon; load_icon().load()"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & "$env:RUNNER_TEMP/tray-venv/Scripts/dwork-tray.exe" --help
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

  debian:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: sudo apt-get update && sudo apt-get install -y build-essential debhelper python3-yaml python3-jsonschema bash-completion zsh lintian
      - run: python3 scripts/build-deb.py
      - run: lintian dist/debian/*.deb
      - run: |
          sudo apt-get install -y ./dist/debian/dwork_*_all.deb
          /usr/bin/dwork --help
          test -f /usr/share/bash-completion/completions/dwork
          test -f /usr/share/zsh/vendor-completions/_dwork
          mkdir -p /tmp/dwork-deb-smoke
          printf 'version: 1\ncompose:\n  enabled: false\n' > /tmp/dwork-deb-smoke/dwork.yml
          cd /tmp/dwork-deb-smoke
          /usr/bin/dwork --dry-run
      - name: Check installed Debian Zsh completion
        run: zsh -fc 'autoload -Uz compinit; compinit -i -D; [[ ${_comps[dwork]} == _dwork ]]'

  homebrew:
    name: Homebrew (${{ matrix.source }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        source: [stable, checkout]
        os: >-
          ${{ fromJSON(
            (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v'))
            && '["ubuntu-24.04","macos-15","macos-15-intel"]'
            || '["ubuntu-24.04","macos-15"]'
          ) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"
      - name: Prepare exact checkout source
        if: matrix.source == 'checkout'
        shell: bash
        run: python scripts/prepare-homebrew-checkout.py --output "$RUNNER_TEMP/dwork-homebrew" --expected-revision "$GITHUB_SHA"
      - uses: Homebrew/actions/setup-homebrew@4790763c0a3ba4036f72634dc079c4a7dfcd4878 # main
      - name: Install and test selected source
        shell: bash
        run: |
          brew tap-new hayyaun/dwork-test
          formula=packaging/homebrew/dwork.rb
          if [ "$DWORK_SOURCE" = checkout ]; then
            formula="$RUNNER_TEMP/dwork-homebrew/dwork.rb"
            cat "$RUNNER_TEMP/dwork-homebrew/source.json"
          fi
          cp "$formula" "$(brew --repository hayyaun/dwork-test)/Formula/dwork.rb"
          brew style hayyaun/dwork-test/dwork
          brew install --build-from-source hayyaun/dwork-test/dwork
          brew test hayyaun/dwork-test/dwork
          if [ "$DWORK_SOURCE" = stable ]; then
            brew audit --strict hayyaun/dwork-test/dwork
          fi
        env:
          DWORK_SOURCE: ${{ matrix.source }}
          HOMEBREW_GIT_NAME: github-actions[bot]
          HOMEBREW_GIT_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
