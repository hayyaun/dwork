name: Package verification

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v[0-9]*.[0-9]*.[0-9]*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04]
        python: ["3.10", "3.14"]
        # Keep the minimum macOS Python on routine runs; expand on tags/manual runs.
        include: >-
          ${{ fromJSON(
            (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v'))
            && '[{"os":"macos-15","python":"3.13"},{"os":"macos-15","python":"3.14"},{"os":"macos-15-intel","python":"3.14"}]'
            || '[{"os":"macos-15","python":"3.13"}]'
          ) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install build twine PyYAML
      - name: Source tests
        shell: bash
        run: |
          result=0
          for test_file in tests/test_*.py; do
            python -B -m unittest discover -s tests -p "$(basename "$test_file")" -v --failfast || result=1
          done
          exit "$result"
      - run: python scripts/verify-python-package.py

  debian:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: sudo apt-get update && sudo apt-get install -y build-essential debhelper python3-yaml zsh lintian
      - run: python3 scripts/build-deb.py
      - run: lintian dist/debian/*.deb
      - run: |
          sudo apt-get install -y ./dist/debian/dwork_*_all.deb
          /usr/bin/dwork --help
          mkdir -p /tmp/dwork-deb-smoke
          printf 'version: 1\ncompose:\n  enabled: false\n' > /tmp/dwork-deb-smoke/dwork.yml
          cd /tmp/dwork-deb-smoke
          /usr/bin/dwork --dry-run

  homebrew:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: >-
          ${{ fromJSON(
            (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v'))
            && '["ubuntu-24.04","macos-15","macos-15-intel"]'
            || '["ubuntu-24.04","macos-15"]'
          ) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: Homebrew/actions/setup-homebrew@4790763c0a3ba4036f72634dc079c4a7dfcd4878 # main
      - run: |
          brew tap-new hayyaun/dwork-test
          cp packaging/homebrew/dwork.rb "$(brew --repository hayyaun/dwork-test)/Formula/dwork.rb"
          brew style hayyaun/dwork-test/dwork
          brew install --build-from-source hayyaun/dwork-test/dwork
          brew test hayyaun/dwork-test/dwork
          brew audit --strict hayyaun/dwork-test/dwork
        env:
          HOMEBREW_GIT_NAME: github-actions[bot]
          HOMEBREW_GIT_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
