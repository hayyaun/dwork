name: Portable Windows tray

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths: ["companion/**", "packaging/windows/**", "scripts/*windows-tray.py", "tests/test*tray.py", ".github/workflows/windows-portable.yml"]
  push:
    branches: ["**"]
    paths: ["companion/**", "packaging/windows/**", "scripts/*windows-tray.py", "tests/test*tray.py", ".github/workflows/windows-portable.yml"]

permissions:
  contents: read

jobs:
  portable:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          architecture: x64
      - name: Install build tools on the CI runner only
        shell: pwsh
        run: |
          python -m pip install "PyInstaller==6.22.3" ./companion
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Source transport and frozen-runtime regressions
        shell: pwsh
        run: |
          python -B tests/test_wsl_tray.py -v
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -B tests/test_portable_tray.py -v
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build self-contained tray and terminal helper
        shell: pwsh
        run: |
          python scripts/build-windows-tray.py --output "$env:RUNNER_TEMP/portable-assets"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Verify extracted archive without external Python on child PATH
        shell: pwsh
        run: |
          $archive = (Get-Item "$env:RUNNER_TEMP/portable-assets/*.zip").FullName
          Expand-Archive -LiteralPath $archive -DestinationPath "$env:RUNNER_TEMP/extracted-tray"
          python scripts/verify-windows-tray.py --app "$env:RUNNER_TEMP/extracted-tray/dwork-tray"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-assets-windows
          path: ${{ runner.temp }}/portable-assets/
          if-no-files-found: error
          retention-days: 14
