[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "dwork-tray"
version = "0.2.1"
description = "Optional native Linux/macOS and Windows-to-WSL tray companion for dwork"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["dwork-cli>=0.4.0,<0.6; sys_platform != 'win32'", "pystray>=0.19.5,<0.20", "Pillow>=10,<13"]

[project.scripts]
dwork-tray = "dwork_tray.app:cli"

[tool.setuptools.package-data]
dwork_tray = ["assets/tray.png", "assets/tray.svg"]

[tool.setuptools.packages.find]
where = ["src"]
